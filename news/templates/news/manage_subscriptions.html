
{% extends "news/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Manage Subscriptions</h2>

    <p>Select the journalists and publishers whose articles
        you would like to follow.</p>

    <form method="post">
        {% csrf_token %}

        <h4 class="mt-4">Journalists</h4>
        {{ form.journalists }}

        <h4 class="mt-4">Publishers</h4>
        {{ form.publishers }}

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                Save Subscriptions
            </button>

            <a href="{% url 'article_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
