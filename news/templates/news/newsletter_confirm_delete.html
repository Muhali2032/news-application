{% extends "news/base.html" %}

{% block title %}Delete Newsletter | NewsHub{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="fw-bold text-danger mb-3">
                    Delete Newsletter
                </h1>

                <p>
                    Are you sure you want to delete this newsletter?
                </p>

                <h5>{{ newsletter.title }}</h5>

                <p class="text-muted">
                    Created by {{ newsletter.author.username }}
                </p>

                <form method="post">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Confirm Delete
                    </button>

                    <a href="{% url 'newsletter_list' %}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
